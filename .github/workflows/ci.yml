name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: ShellCheck
        run: shellcheck -x .claude/hooks/*.sh .claude/hooks/lib/common.sh tests/run-tests.sh
      - name: settings.json is valid JSON
        run: jq empty .claude/settings.json

  test:
    # macOS ships BSD grep (not GNU grep): the rules must match the same way on both.
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - name: Hook tests
        run: tests/run-tests.sh
